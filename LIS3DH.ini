[main]
# Experiment title
title       = Accelerometer(LIS3DH)
[notsave]
# Data save directory (folder) name
dir_name    = data_LIS3DH
# Plotted time span
time_width  = 20
# Minimum peak interval (sec) (peaks closer together than this are not detected)
min_peak_dist = 0.400
[board]
# Time unit: 3 = milliseconds, 6 = microseconds
time_unit    = 6
# SPI CS pin (SCK/MOSI/MISO use SPI0 defaults, fixed at GP18/19/16)
spi_cs_pin   = 17
spi_sck_pin  = 18
spi_mosi_pin = 19
spi_miso_pin = 16
# Output Data Rate (CTRL_REG1's ODR field; 5=100Hz). 8/9/10 are the
# three fastest choices and interact with operating_mode below:
# 8=1.6kHz (Low-power only -- no Normal/HR entry exists for this code),
# 9=1.344kHz (Normal/High-Resolution; follows operating_mode normally),
# 10=5.376kHz (Low-power only -- same register code as 9, but a separate
# odr value since the two share one 4-bit field and must be told apart).
odr          = 5
# Full Scale (0=+-2g, 1=+-4g, 2=+-8g, 3=+-16g)
fs           = 0
# Operating mode (datasheet's own term, Table 10 -- not "resolution_mode"
# or "power_mode": Normal/High-Resolution differ only in resolution
# [identical power consumption per Table 12], while Low-power differs in
# both resolution and power, so neither single-axis name fits all three):
# 0=Low-power (8bit), 1=Normal (10bit), 2=High-Resolution (12bit,
# default). Forced to Low-power regardless of this setting when odr is
# 8 or 10 (those ODR choices only exist in Low-power mode). All three
# modes verified on real hardware -- see PICO_LIS3DH_SPI.ino's comments.
operating_mode = 2
[code]
# Caution: class-variable scoping needs care here
# Workaround: use a lambda call (or similar) to pass the class variable into the "nested scope"
#  y = (lambda x:[x for i in range(10)])(x)
#
window_setting = title_style    = "color:blue;"
		 text_box_style = "background:navy; color:white;"
#		 self.setWindowIcon(QIcon('icon.png'))                        # Icon setting
#
# Menubar setting
#
menubar = menubar = self.menuBar()
          fM = menubar.addMenu('&File')
          sM = menubar.addMenu('&Setting')
          fM.addAction(Qtu.setQAction(self, 'Test(not recording)', self.on_test_button))
          fM.addAction(Qtu.setQAction(self, 'Run(recording)', self.on_start_button))
          fM.addAction(Qtu.setQAction(self, 'MArk(checkpoint / ctrl+a)', self.on_checkpoint_button, self.style().standardIcon(QStyle.SP_DialogApplyButton)))
          fM.addAction(Qtu.setQAction(self, 'Stop', self.on_stop_button))
          fM.addAction(Qtu.setQAction(self, 'Quit', self.on_quit_button, self.style().standardIcon(QStyle.SP_DialogCancelButton)))
          sM.addAction(Qtu.setQAction(self, 'Information', self.on_subject_button))
          sM.addAction(Qtu.setQAction(self, 'Parameter', self.on_param_setting_button))
#
# figs (in window.py) USE self.board.XXX
# struct = "time(u4:func0), x(u2:func1), y(u2:func1), z(u2:func1)"
# -> self.board.lab = ['time','x','y','z'], self.board.func_unit = ['sec','g']
#
figs = [
	[{'label' : (self.board.lab[0]+'('+self.board.func_unit[0]+')', self.board.lab[1]+'('+self.board.func_unit[1]+')'),
	 'limit' : (None, (-[2,4,8,16][self.board.fs], [2,4,8,16][self.board.fs])),
	 'data'  : ((0, 1, {'peak':False, 'raw':(False, False)}),),
	 'grid'  : True,
	 'pargs' : {'ls' : '', 'marker': 'o', 'ms' : 1, 'color':'red'},
	 'fargs' : {'ls' : '-', 'lw' : 1, 'marker': 'o', 'ms' : 0},
	 'legend': False}],
	[{'label' : (self.board.lab[0]+'('+self.board.func_unit[0]+')', self.board.lab[2]+'('+self.board.func_unit[1]+')'),
	 'limit' : (None, (-[2,4,8,16][self.board.fs], [2,4,8,16][self.board.fs])),
	 'data'  : ((0, 2, {'peak':False, 'raw':(False, False)}),),
	 'grid'  : True,
	 'pargs' : {'ls' : '', 'marker': 'o', 'ms' : 1, 'color':'red'},
	 'fargs' : {'ls' : '-', 'lw' : 1, 'marker': 'o', 'ms' : 0},
	 'legend': False}],
	[{'label' : (self.board.lab[0]+'('+self.board.func_unit[0]+')', self.board.lab[3]+'('+self.board.func_unit[1]+')'),
	 'limit' : (None, (-[2,4,8,16][self.board.fs], [2,4,8,16][self.board.fs])),
	 'data'  : ((0, 3, {'peak':False, 'raw':(False, False)}),),
	 'grid'  : True,
	 'pargs' : {'ls' : '', 'marker': 'o', 'ms' : 1, 'color':'red'},
	 'fargs' : {'ls' : '-', 'lw' : 1, 'marker': 'o', 'ms' : 0},
	 'legend': False}]
       ] + [{'subplots': {'figsize': (15,6), 'sharex':'all', 'tight_layout':True, 'squeeze':False },
	  'adjust'  : {'bottom':None, 'top':None, 'hspace':0.05}}]
#
# panel1(buttons) template (in window.py) USE self.board.XXX
panel1 = {
          'subject'    : [Qtu.setQLabel(""),         'Label'],
          'Test'       : [self.on_test_button,       'PushButton'],
          'Run'        : [self.on_start_button,      'PushButton'],
          'mArk' : [self.on_checkpoint_button, 'PushButton'],
          'Stop'       : [self.on_stop_button,       'PushButton'] }
#
# lcd template (in window.py) USE self.board.XXX
lcd = [{'lab_t0': QLabel(u"t0"), 't0': Qtu.setQLCDNumber(self ,'Flat'), 'lab_dt': QLabel(u"   Δt")},
       {'lab_t1': QLabel(u"t1"), 't1': Qtu.setQLCDNumber(self ,'Flat'), 'dt'    : Qtu.setQLCDNumber(self ,'Flat', 7)},
       {'lab_x': QLabel(u"x(g)"), 'x': Qtu.setQLCDNumber(self ,'Flat')},
       {'lab_y': QLabel(u"y(g)"), 'y': Qtu.setQLCDNumber(self ,'Flat')},
       {'lab_z': QLabel(u"z(g)"), 'z': Qtu.setQLCDNumber(self ,'Flat')}
       ]
#
# Window Layout (in window.py)
layout     = [[figs](10),
	      [panel1, lcd,   1](1)]
#
# lcd update (in window.py) USE self.board.XXX
lcd_update = self.lcd[0]['t0'].display("%.0f" % first_last_data[0][0]),
	     self.lcd[1]['t1'].display("%.0f" % first_last_data[0][1]),
	     self.lcd[1]['dt'].display("%.2f" % (first_last_data[0][1] - first_last_data[0][0])),
	     self.lcd[2]['x'].display("%.3f" % first_last_data[1][1]),
	     self.lcd[3]['y'].display("%.3f" % first_last_data[2][1]),
	     self.lcd[4]['z'].display("%.3f" % first_last_data[3][1])
#
# subject window template (in window.py) USE self.board.XXX
#
subject_template = {'room'         : [u'Room', QLineEdit(), 'LineEdit'],
                    'target'       : [u'Target', QLineEdit(), 'LineEdit'],
                    'exp_settings' : [u'Settings', QLineEdit(), 'LineEdit'],
                    'name'         : [u'Operator', QLineEdit(), 'LineEdit'],
                    'memo'         : [u'MEMO', QLineEdit(), 'LineEdit']
		  }
#
# execute below After subject window closed
#
after_subject_window = txt = f"Room: {self.subject['room']}\nTarget: {self.subject['target']}\nSettings: {self.subject['exp_settings']}\nOperator: {self.subject['name']}\nMEMO:{self.subject['memo']}"
		       self.panel1['subject'][0].setText(txt)
#
# parameter setting window template (in window.py) USE self.board.XXX
#
param_setting_template = {'spi_cs_pin' : [u'SPI CS Pin', Qtu.setQSpinBox(self, (0, 28)), 'SpinBox'],
			  'odr' : [u'Output Data Rate', Qtu.setQComboBox(self,
			      ['1Hz', '10Hz', '25Hz', '50Hz', '100Hz', '200Hz', '400Hz',
			       '1.344kHz', '1.6kHz(LP only)', '5.376kHz(LP only)'],
			      data=['1', '2', '3', '4', '5', '6', '7', '9', '8', '10']), 'ComboBox'],
			  'fs'  : [u'Full Scale', Qtu.setQComboBox(self,
			      [u'±2g', u'±4g', u'±8g', u'±16g'],
			      data=['0', '1', '2', '3']), 'ComboBox'],
			  'operating_mode' : [u'Operating Mode\n(auto -> Low-power\nat 1.6k/5.376kHz ODR)', Qtu.setQComboBox(self,
			      ['High-Resolution (12bit)', 'Normal (10bit)', 'Low-power (8bit)'],
			      data=['2', '1', '0']), 'ComboBox']
			 }
