[main]
# Experiment title
title       = Accelerometer(LIS3DHx2)
[notsave]
# Data save directory (folder) name
dir_name    = data_LIS3DHx2
# Plotted time span
time_width  = 20
# Minimum peak interval (sec) (peaks closer together than this are not detected)
min_peak_dist = 0.400
[board]
# Time unit: 3 = milliseconds, 6 = microseconds
time_unit    = 6
## LIS3DH x2 (SPI0 shared bus)
# SCK/MOSI/MISO share the bus; only CS uses a separate pin per device
spi_sck_pin  = 18
spi_mosi_pin = 19
spi_miso_pin = 16
# GP17 (the single-LIS3DH default) is free here since this sketch has no
# X95840W claiming it. GP20 for CS2 (not e.g. GP2) because it sits
# immediately next to the GP16/17/18/19 cluster this sketch already uses --
# unlike DPG_X95840W_LIS3DHx2, nothing here claims GP20/21 for I2C, so the
# closest free pin to the bus is available.
spi_cs_pin1  = 17
spi_cs_pin2  = 20
# Output Data Rate (CTRL_REG1's ODR field; 5=100Hz)
odr1         = 5
odr2         = 5
# Full Scale (0=+-2g, 1=+-4g, 2=+-8g, 3=+-16g)
fs1          = 0
fs2          = 0
# Resolution mode: 1=High-Resolution (12bit, default, ~149Hz usable
# bandwidth at the same ODR), 0=Normal (10bit, coarser but ~672Hz usable
# bandwidth). NOT yet verified on real hardware -- see
# PICO_LIS3DHx2.ino's comments.
hr_mode1     = 1
hr_mode2     = 1
[code]
# Caution: class-variable scoping needs care here
# Workaround: use a lambda call (or similar) to pass the class variable into the "nested scope"
#  y = (lambda x:[x for i in range(10)])(x)
