[main]
# 実験タイトル
title       = Accelerometer(LIS3DHx3)
[notsave]
# data保存directory(Folder)名
dir_name    = data_LIS3DHx3
# 描画する時間幅
time_width  = 20
# peak間隔の最小幅(sec)（これ以下のピーク間隔は検出しない）
min_peak_dist = 0.400
[board]
# 時間の単位 3→milli sec, 6→micro sec
time_unit    = 6
## LIS3DH x3 (SPI0 Bus共有)
# SCK/MOSI/MISOはBus共有、CSだけ機体ごとに別Pin
spi_sck_pin  = 18
spi_mosi_pin = 19
spi_miso_pin = 16
# GP17（単体LIS3DHの既定値）は、この構成ではX95840Wが使用しないため空いて
# いる。CS2/CS3にGP20/GP21を使うのは、Picoの実基板上でGP16-19に直接隣接
# しており、この回路が既に使っているBusに最も近い空きピンのため。
spi_cs_pin1  = 17
spi_cs_pin2  = 20
spi_cs_pin3  = 21
# Output Data Rate (CTRL_REG1のODR field; 5=100Hz)
odr1         = 5
odr2         = 5
odr3         = 5
# Full Scale (0=+-2g, 1=+-4g, 2=+-8g, 3=+-16g)
fs1          = 0
fs2          = 0
fs3          = 0
# 分解能モード: 1=高分解能（HR、12bit、既定値、実用帯域は約149Hz）、
# 0=Normal（10bit、粗いが実用帯域は約672Hz）。まだ実機未検証（詳細は
# PICO_LIS3DHx3.inoのコメント参照）。
hr_mode1     = 1
hr_mode2     = 1
hr_mode3     = 1
[code]
# クラス変数のスコープには注意が必要
# 解決策:lambda式による関数呼び出しなどを使って「ネストされたスコープ」にクラス変数を届けてやれ
#  y = (lambda x:[x for i in range(10)])(x)
#
window_setting = title_style    = "color:blue;"
		 text_box_style = "background:navy; color:white;"
#		 self.setWindowIcon(QIcon('icon.png'))                        # Icon setting
#
# Menubar setting
#
menubar = menubar = self.menuBar()
          fM = menubar.addMenu('&File')
          sM = menubar.addMenu('&Setting')
          fM.addAction(Qtu.setQAction(self, 'テスト（記録なし）(T)', self.on_test_button))
          fM.addAction(Qtu.setQAction(self, '実行（記録中）(R)', self.on_start_button))
          fM.addAction(Qtu.setQAction(self, 'マーク（チェックポイント）(M/A)', self.on_checkpoint_button, self.style().standardIcon(QStyle.SP_DialogApplyButton)))
          fM.addAction(Qtu.setQAction(self, '停止(S)', self.on_stop_button))
          fM.addAction(Qtu.setQAction(self, '終了(Q)', self.on_quit_button, self.style().standardIcon(QStyle.SP_DialogCancelButton)))
          sM.addAction(Qtu.setQAction(self, '測定情報(I)', self.on_subject_button))
          sM.addAction(Qtu.setQAction(self, 'パラメータ設定(P)', self.on_param_setting_button))
#
# figs (in window.py) USE self.board.XXX
# struct = "time(u4:func0), x1,y1,z1(u2:func1), x2,y2,z2(u2:func2), x3,y3,z3(u2:func3)"
# -> self.board.lab = ['time','x1','y1','z1','x2','y2','z2','x3','y3','z3']
#    self.board.func_unit = ['sec','g','g','g']
#
figs = (lambda self:[[{'data'  : ((0, 1+k , {'peak':False, 'raw':(False, False)}),),
       	       	       'label' : (self.board.lab[0]+'('+self.board.func_unit[0]+')', self.board.lab[1+k]+'('+self.board.func_unit[1]+')'),
          	       'limit' : (None, (-2, 2)),
		       'grid'  : True,
		       'pargs' : {'ls' : '', 'marker': 'o', 'ms' : 1, 'color':'red'},
		       'fargs' : {'ls' : '-', 'lw' : 1, 'marker': 'o', 'ms' : 0},
		       'legend': False}] for k in range(3)])(self) +\
	    (lambda self:[[{'data'  : ((0, 4+k , {'peak':False, 'raw':(False, False)}),),
       	       	       'label' : (self.board.lab[0]+'('+self.board.func_unit[0]+')', self.board.lab[4+k]+'('+self.board.func_unit[2]+')'),
          	       'limit' : (None, (-2, 2)),
		       'grid'  : True,
		       'pargs' : {'ls' : '', 'marker': 'o', 'ms' : 1, 'color':'red'},
		       'fargs' : {'ls' : '-', 'lw' : 1, 'marker': 'o', 'ms' : 0},
		       'legend': False}] for k in range(3)])(self) +\
	    (lambda self:[[{'data'  : ((0, 7+k , {'peak':False, 'raw':(False, False)}),),
       	       	       'label' : (self.board.lab[0]+'('+self.board.func_unit[0]+')', self.board.lab[7+k]+'('+self.board.func_unit[3]+')'),
          	       'limit' : (None, (-2, 2)),
		       'grid'  : True,
		       'pargs' : {'ls' : '', 'marker': 'o', 'ms' : 1, 'color':'red'},
		       'fargs' : {'ls' : '-', 'lw' : 1, 'marker': 'o', 'ms' : 0},
		       'legend': False}] for k in range(3)])(self) +\
	    [{'subplots': {'figsize': (15,12), 'sharex':'all', 'tight_layout':True, 'squeeze':False },
	      'adjust'  : {'bottom':None, 'top':None, 'hspace':0.05}}]
#
# panel1(buttons) template (in window.py) USE self.board.XXX
panel1 = {
          'subject'    : [Qtu.setQLabel(""),         'Label'],
          'テスト'       : [self.on_test_button,       'PushButton'],
          '実行'        : [self.on_start_button,      'PushButton'],
          'マーク' : [self.on_checkpoint_button, 'PushButton'],
          '停止'       : [self.on_stop_button,       'PushButton'] }
#
# lcd template (in window.py) USE self.board.XXX
lcd = [{'lab_t0': QLabel(u"t0"), 't0': Qtu.setQLCDNumber(self ,'Flat'), 'lab_dt': QLabel(u"   Δt")},
       {'lab_t1': QLabel(u"t1"), 't1': Qtu.setQLCDNumber(self ,'Flat'), 'dt'    : Qtu.setQLCDNumber(self ,'Flat', 7)},
       {'lab_a1': QLabel(u"Accel #1\n(g)"), 'x1': Qtu.setQLCDNumber(self ,'Flat'), 'y1': Qtu.setQLCDNumber(self ,'Flat'), 'z1': Qtu.setQLCDNumber(self ,'Flat')},
       {'lab_a2': QLabel(u"Accel #2\n(g)"), 'x2': Qtu.setQLCDNumber(self ,'Flat'), 'y2': Qtu.setQLCDNumber(self ,'Flat'), 'z2': Qtu.setQLCDNumber(self ,'Flat')},
       {'lab_a3': QLabel(u"Accel #3\n(g)"), 'x3': Qtu.setQLCDNumber(self ,'Flat'), 'y3': Qtu.setQLCDNumber(self ,'Flat'), 'z3': Qtu.setQLCDNumber(self ,'Flat')}
       ]
#
# Window Layout (in window.py)
layout     = [[figs](10),
	      [panel1, lcd,   1](1)]
#
# lcd update (in window.py) USE self.board.XXX
lcd_update = self.lcd[0]['t0'].display("%.0f" % first_last_data[0][0]),
	     self.lcd[1]['t1'].display("%.0f" % first_last_data[0][1]),
	     self.lcd[1]['dt'].display("%.2f" % (first_last_data[0][1] - first_last_data[0][0])),
	     self.lcd[2]['x1'].display("%.3f" % first_last_data[1][1]),
	     self.lcd[2]['y1'].display("%.3f" % first_last_data[2][1]),
	     self.lcd[2]['z1'].display("%.3f" % first_last_data[3][1]),
	     self.lcd[3]['x2'].display("%.3f" % first_last_data[4][1]),
	     self.lcd[3]['y2'].display("%.3f" % first_last_data[5][1]),
	     self.lcd[3]['z2'].display("%.3f" % first_last_data[6][1]),
	     self.lcd[4]['x3'].display("%.3f" % first_last_data[7][1]),
	     self.lcd[4]['y3'].display("%.3f" % first_last_data[8][1]),
	     self.lcd[4]['z3'].display("%.3f" % first_last_data[9][1])
#
# subject window template (in window.py) USE self.board.XXX
#
subject_template = {'room'         : [u'測定場所', QLineEdit(), 'LineEdit'],
                    'target'       : [u'測定対象', QLineEdit(), 'LineEdit'],
                    'exp_settings' : [u'実験設定', QLineEdit(), 'LineEdit'],
                    'name'         : [u'測定者', QLineEdit(), 'LineEdit'],
                    'memo'         : [u'MEMO', QLineEdit(), 'LineEdit']
		  }
#
# execute below After subject window closed
#
after_subject_window = txt = f"場所: {self.subject['room']}\n対象: {self.subject['target']}\n設定: {self.subject['exp_settings']}\n測定者: {self.subject['name']}\nMEMO:{self.subject['memo']}"
		       self.panel1['subject'][0].setText(txt)
#
# parameter setting window template (in window.py) USE self.board.XXX
#
param_setting_template = {'spi_cs_pin1' : [u'LIS3DH #1 CS Pin', Qtu.setQSpinBox(self, (0, 28)), 'SpinBox'],
			  'spi_cs_pin2' : [u'LIS3DH #2 CS Pin', Qtu.setQSpinBox(self, (0, 28)), 'SpinBox'],
			  'spi_cs_pin3' : [u'LIS3DH #3 CS Pin', Qtu.setQSpinBox(self, (0, 28)), 'SpinBox'],
			  'odr1' : [u'Accel #1 サンプリング周波数', Qtu.setQComboBox(self,
			      ['1Hz', '10Hz', '25Hz', '50Hz', '100Hz', '200Hz', '400Hz',
			       '1.6kHz(LP only)', '1.344kHz/5.376kHz(LP)'],
			      data=['1', '2', '3', '4', '5', '6', '7', '8', '9']), 'ComboBox'],
			  'odr2' : [u'Accel #2 サンプリング周波数', Qtu.setQComboBox(self,
			      ['1Hz', '10Hz', '25Hz', '50Hz', '100Hz', '200Hz', '400Hz',
			       '1.6kHz(LP only)', '1.344kHz/5.376kHz(LP)'],
			      data=['1', '2', '3', '4', '5', '6', '7', '8', '9']), 'ComboBox'],
			  'odr3' : [u'Accel #3 サンプリング周波数', Qtu.setQComboBox(self,
			      ['1Hz', '10Hz', '25Hz', '50Hz', '100Hz', '200Hz', '400Hz',
			       '1.6kHz(LP only)', '1.344kHz/5.376kHz(LP)'],
			      data=['1', '2', '3', '4', '5', '6', '7', '8', '9']), 'ComboBox'],
			  'fs1'  : [u'Accel #1 測定レンジ', Qtu.setQComboBox(self,
			      [u'±2g', u'±4g', u'±8g', u'±16g'],
			      data=['0', '1', '2', '3']), 'ComboBox'],
			  'fs2'  : [u'Accel #2 測定レンジ', Qtu.setQComboBox(self,
