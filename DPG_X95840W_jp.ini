[main]
# 実験タイトル
title       = DPG(X95840W)
[notsave]
# data保存directory(Folder)名
dir_name    = data
# 描画する時間幅
time_width  = 20
# 描画する点の数(20-1000) (Slow animation ONLY)
num_points  = 100
# peak間隔の最小幅(sec)（これ以下のピーク間隔は検出しない）
min_peak_dist = 0.400
[board]
# AD Converter resolution (default 10)
ADCres       = 12
# 回路に供給する電圧
volt         = 5
# 時間の単位 3→milli sec, 6→micro sec
time_unit    = 6
# data取得時間間隔(micro sec) (0...serial transfer limit)
time_interval = 2000
# AD変換する回数(1-32)
num_avg     = 1
# 使用ポート番号(0,1,2,3,4,5,)  要素数１の場合は必ず最後に[,]を書くこと
#port_num    = 0,
port_num    = 0,1,2
#port_num    = 2,
## For Calibration
# i2c pin No       std::vector<int>  要素数１の場合は必ず最後に[,]を書くこと
i2c_pinno      = 20,
# i2c device Addr  std::vector<int>  要素数１の場合は必ず最後に[,]を書くこと
i2c_addr       = 0x50,
#i2c_addr       = 0x53,
# calibration waiting time (msec)    回路が安定するまでの待時間
calib_waiting  = 500
# time interval for detecting rane(max - min) of signal (msec)
calib_int_msec = 2000
#  調整最大振幅(%) & 調整幅(%) for dpm0, dpm1
calib_amplitude_max  = 10,20,30
#calib_amplitude_max  = 30,30,30
calib_tuning_width   = 5,5,5
[code]
# クラス変数のスコープには注意が必要
# 解決策:lambda式による関数呼び出しなどを使って「ネストされたスコープ」にクラス変数を届けてやれ
#  y = (lambda x:[x for i in range(10)])(x)
#
window_setting = title_style    = "color:orange;"
		 text_box_style = "background:#000000; color:white;"
#		 self.setWindowIcon(QIcon('icon.png'))                        # Icon setting
#
# Menubar setting
#
menubar = menubar = self.menuBar()
          fM = menubar.addMenu('&File')
          sM = menubar.addMenu('&Setting')
          fM.addAction(Qtu.setQAction(self, 'キャリブレーション（記録なし）(B)', self.on_calib_button))
          fM.addAction(Qtu.setQAction(self, 'テスト（記録なし）(T)', self.on_test_button))
          fM.addAction(Qtu.setQAction(self, '実行（記録中）(R)', self.on_start_button))
          fM.addAction(Qtu.setQAction(self, 'マーク（チェックポイント）(M/A)', self.on_checkpoint_button, self.style().standardIcon(QStyle.SP_DialogApplyButton)))
          fM.addAction(Qtu.setQAction(self, '停止(S)', self.on_stop_button))
          fM.addAction(Qtu.setQAction(self, '終了(Q)', self.quit, self.style().standardIcon(QStyle.SP_DialogCancelButton)))
          sM.addAction(Qtu.setQAction(self, '測定情報(I)', self.on_subject_button))
          sM.addAction(Qtu.setQAction(self, 'パラメータ設定(P)', self.on_param_setting_button))
#
# figs (in window.py) USE self.board.XXX
#
# {'label'  : (None|auto|'hoge', None|auto|'hoge'), 'label2' : (None|auto|'hoge', None|auto|'hoge'),
#  'limit'  : (None|auto|num ,   None|auto|num ),   'limit2' : (None|auto|num ,   None|auto|num ),
#  'data'   : ((num0, num1, {'peak':True|False, 'raw':(False, True), 'label':'1'} ),
#              (num0, num2, {'peak':True|False, 'raw':(False, True), 'label':'2'} ), ...),
#  'grid'   : True,
#  'legend' : False}
#       |
#       V
#  [ [ dict, dict,...], [ dict, dict,...], ...
#    , {'figsize': (15,6), 'sharex':'"none"'|'"all"'|'"row"'|'"col"', 'sharey':'"all"',...} ]
#    Figure dimension =  columns * rows
#
#          	       'limit': (None, (0, 4096)),
#          	       'limit' : (None, self.board.lim_auto_raw[1]),
figs = (lambda self:[[{'data'  : ((0, k+1 , {'peak':False, 'raw':(False, False)}),),
       	       	       'label' : (self.board.lab[0]+'('+self.board.func_unit[0]+')', self.board.lab[k+1]+self.board.lab_sub[k+1]),
          	       'limit' : (None, 'auto'),
		       'grid'  : True,
		       'pargs' : {'ls' : '', 'marker': 'o', 'ms' : 5, 'color':'red'},  # peak args
		       'fargs' : {'ls' : '-', 'lw' : 3, 'marker': 'o', 'ms' : 0},       # 'fargs' : {'ls' : '-', 'lw' : 4, 'marker': 'o', 'ms' : 10},
		       'legend': False}] for k, p_no in enumerate(self.board.port_num)])(self) +\
		    [{'subplots': {'figsize': (15,6), 'sharex':'all', 'tight_layout':True, 'squeeze':False },
		      'adjust'  : {'bottom':None, 'top':None, 'hspace':0.05}}]
#
# panel1(buttons) template (in window.py) USE self.board.XXX
panel1 = {
          'subject'    : [Qtu.setQLabel(""),         'Label'],
          'キャリブレーション'  : [self.on_calib_button,      'PushButton'], 
          'テスト'       : [self.on_test_button,       'PushButton'], 
          '実行'        : [self.on_start_button,      'PushButton'],
          'マーク' : [self.on_checkpoint_button, 'PushButton'],
          '停止'       : [self.on_stop_button,       'PushButton'] }
#
# lcd template (in window.py) USE self.board.XXX
lcd = [{'lab_t0': QLabel(u"t0"), 't0': Qtu.setQLCDNumber(self ,'Flat'), 'lab_dt': QLabel(u"   Δt")},
       {'lab_t1': QLabel(u"t1"), 't1': Qtu.setQLCDNumber(self ,'Flat'), 'dt'    : Qtu.setQLCDNumber(self ,'Flat', 7)},
       {'lab_No': None, 'lab_V': QLabel(u"Volt\n(V)"), 'lab_HBR': QLabel(u"HBR\n(bpm)"), 'lab_dpm': QLabel(u"dpm\n0-255")}
       ] + (lambda self:[
       {'p'+str(k): QLabel("P.%d" % p_no),
        'V' : Qtu.setQLCDNumber(self ,'Flat'),
        'HR': Qtu.setQLCDNumber(self ,'Flat'),
        'dpm': Qtu.setQLCDNumber(self ,'Flat')}
	for k, p_no in enumerate(self.board.port_num)])(self)
#
# Window Layout (in window.py)
#        2rows    width  2columns     addstretch  width
layout     = [[figs](10),
	      [panel1, lcd,   1](1)]
#
#    , columnstretch=[1,3,3] 
#
# lcd update (in window.py) USE self.board.XXX
lcd_update = self.lcd[0]['t0'].display("%.0f" % first_last_data[0][0]),
	     self.lcd[1]['t1'].display("%.0f" % first_last_data[0][1]),
	     self.lcd[1]['dt'].display("%.2f" % (first_last_data[0][1] - first_last_data[0][0])),
	     (lambda first_last_data,peak_interval,self:[
	     [
	     lcd['HR'].display("%.0f" % 1 if peak_interval[k] is None or peak_interval[k] == 0 else int(60.0/peak_interval[k])),
	     lcd['V'].display("%.2f" % float(first_last_data[k+1][1])),
	     lcd['dpm'].display("%.0f" % self.board.dpm[k] if self.marker != b'c' else
	     					first_last_data[-(3-k)][1])
             ]	for k, lcd in enumerate(self.lcd[3:])   ])(first_last_data,peak_interval,self)
