[main]
# 実験タイトル
title       = Accelerometer(LIS3DH)
[notsave]
# data保存directory(Folder)名
dir_name    = data_LIS3DH
# 描画する時間幅
time_width  = 20
# 描画する点の数(20-1000) (Slow animation ONLY)
num_points  = 50
# peak間隔の最小幅(sec)（これ以下のピーク間隔は検出しない）
min_peak_dist = 0.400
[board]
# 時間の単位 3→milli sec, 6→micro sec
time_unit    = 6
# SPI CS Pin (SCK/MOSI/MISOはSPI0既定値: GP18/19/16で固定)
spi_cs_pin   = 17
spi_sck_pin  = 18
spi_mosi_pin = 19
spi_miso_pin = 16
# Output Data Rate (CTRL_REG1のODR field; 5=100Hz)
odr          = 5
# Full Scale (0=+-2g, 1=+-4g, 2=+-8g, 3=+-16g)
fs           = 0
[code]
# クラス変数のスコープには注意が必要
# 解決策:lambda式による関数呼び出しなどを使って「ネストされたスコープ」にクラス変数を届けてやれ
#  y = (lambda x:[x for i in range(10)])(x)
#
window_setting = title_style    = "color:blue;"
		 text_box_style = "background:navy; color:white;"
#		 self.setWindowIcon(QIcon('icon.png'))                        # Icon setting
#
# Menubar setting
#
menubar = menubar = self.menuBar()
          fM = menubar.addMenu('&File')
          sM = menubar.addMenu('&Setting')
          fM.addAction(Qtu.setQAction(self, 'テスト（記録なし）(T)', self.on_test_button))
          fM.addAction(Qtu.setQAction(self, '実行（記録中）(R)', self.on_start_button))
          fM.addAction(Qtu.setQAction(self, 'マーク（チェックポイント）(M/A)', self.on_checkpoint_button, self.style().standardIcon(QStyle.SP_DialogApplyButton)))
          fM.addAction(Qtu.setQAction(self, '停止(S)', self.on_stop_button))
          fM.addAction(Qtu.setQAction(self, '終了(Q)', self.quit, self.style().standardIcon(QStyle.SP_DialogCancelButton)))
          sM.addAction(Qtu.setQAction(self, '測定情報(I)', self.on_subject_button))
          sM.addAction(Qtu.setQAction(self, 'パラメータ設定(P)', self.on_param_setting_button))
#
# figs (in window.py) USE self.board.XXX
# struct = "time(u4:func0), x(u2:func1), y(u2:func1), z(u2:func1)"
# -> self.board.lab = ['time','x','y','z'], self.board.func_unit = ['sec','g']
#
figs = [
	[{'label' : (self.board.lab[0]+'('+self.board.func_unit[0]+')', self.board.lab[1]+'('+self.board.func_unit[1]+')'),
	 'limit' : (None, (-2, 2)),
	 'data'  : ((0, 1, {'peak':False, 'raw':(False, False)}),),
	 'grid'  : True,
	 'pargs' : {'ls' : '', 'marker': 'o', 'ms' : 1, 'color':'red'},
	 'fargs' : {'ls' : '-', 'lw' : 1, 'marker': 'o', 'ms' : 0},
	 'legend': False}],
	[{'label' : (self.board.lab[0]+'('+self.board.func_unit[0]+')', self.board.lab[2]+'('+self.board.func_unit[1]+')'),
	 'limit' : (None, (-2, 2)),
	 'data'  : ((0, 2, {'peak':False, 'raw':(False, False)}),),
	 'grid'  : True,
	 'pargs' : {'ls' : '', 'marker': 'o', 'ms' : 1, 'color':'red'},
	 'fargs' : {'ls' : '-', 'lw' : 1, 'marker': 'o', 'ms' : 0},
	 'legend': False}],
	[{'label' : (self.board.lab[0]+'('+self.board.func_unit[0]+')', self.board.lab[3]+'('+self.board.func_unit[1]+')'),
	 'limit' : (None, (-2, 2)),
	 'data'  : ((0, 3, {'peak':False, 'raw':(False, False)}),),
	 'grid'  : True,
	 'pargs' : {'ls' : '', 'marker': 'o', 'ms' : 1, 'color':'red'},
	 'fargs' : {'ls' : '-', 'lw' : 1, 'marker': 'o', 'ms' : 0},
	 'legend': False}]
       ] + [{'subplots': {'figsize': (15,6), 'sharex':'all', 'tight_layout':True, 'squeeze':False },
	  'adjust'  : {'bottom':None, 'top':None, 'hspace':0.05}}]
#
# panel1(buttons) template (in window.py) USE self.board.XXX
panel1 = {
          'subject'    : [Qtu.setQLabel(""),         'Label'],
          'テスト'       : [self.on_test_button,       'PushButton'],
          '実行'        : [self.on_start_button,      'PushButton'],
          'マーク' : [self.on_checkpoint_button, 'PushButton'],
          '停止'       : [self.on_stop_button,       'PushButton'] }
#
# lcd template (in window.py) USE self.board.XXX
lcd = [{'lab_t0': QLabel(u"t0"), 't0': Qtu.setQLCDNumber(self ,'Flat'), 'lab_dt': QLabel(u"   Δt")},
       {'lab_t1': QLabel(u"t1"), 't1': Qtu.setQLCDNumber(self ,'Flat'), 'dt'    : Qtu.setQLCDNumber(self ,'Flat', 7)},
       {'lab_No': None, 'lab_x': QLabel(u"x(g)"), 'lab_y': QLabel(u"y(g)"), 'lab_z': QLabel(u"z(g)")},
       {'x': Qtu.setQLCDNumber(self ,'Flat'), 'y': Qtu.setQLCDNumber(self ,'Flat'), 'z': Qtu.setQLCDNumber(self ,'Flat')}
       ]
#
# Window Layout (in window.py)
layout     = [[figs](10),
	      [panel1, lcd,   1](1)]
#
# lcd update (in window.py) USE self.board.XXX
lcd_update = self.lcd[0]['t0'].display("%.0f" % first_last_data[0][0]),
	     self.lcd[1]['t1'].display("%.0f" % first_last_data[0][1]),
	     self.lcd[1]['dt'].display("%.2f" % (first_last_data[0][1] - first_last_data[0][0])),
	     self.lcd[3]['x'].display("%.3f" % first_last_data[1][1]),
	     self.lcd[3]['y'].display("%.3f" % first_last_data[2][1]),
	     self.lcd[3]['z'].display("%.3f" % first_last_data[3][1])
#
# subject window template (in window.py) USE self.board.XXX
#
subject_template = {'name'   : [u'氏名',     QLineEdit(), 'LineEdit'],
                    'height' : [u'身長(cm)', QLineEdit(), 'LineEdit'],
                    'weight' : [u'体重(kg)', QLineEdit(), 'LineEdit'],
                    'birth'  : [u'生年月日', QDateEdit(), 'DateEdit'],
                    'gender' : [u'性別', Qtu.setQComboBox(self, [u'男', u'女']), 'ComboBox'],
                    'memo'   : [u'MEMO',     QLineEdit(), 'LineEdit']
		  }
#
# execute below After subject window closed
#
after_subject_window = age = utils.calc_age_now(self.subject['birth'])
		       self.subject['age'] = age
		       txt  = f"{self.subject['name']}"
		       if self.subject['gender'] == u'男' : txt += f"({age}) "
		       txt += f"{self.subject['gender']}\n"
		       self.panel1['subject'][0].setText(txt)
#
# parameter setting window template (in window.py) USE self.board.XXX
#
param_setting_template = {'spi_cs_pin' : [u'SPI CS Pin', Qtu.setQSpinBox(self, (0, 28)), 'SpinBox'],
			  'odr' : [u'Output Data Rate\n[1]..1Hz,[2]..10Hz,[3]..25Hz,\n[4]..50Hz,[5]..100Hz,[6]..200Hz,[7]..400Hz', Qtu.setQSpinBox(self, (1, 9)), 'SpinBox'],
			  'fs'  : [u'Full Scale\n[0]..+-2g,[1]..+-4g,\n[2]..+-8g,[3]..+-16g', Qtu.setQSpinBox(self, (0, 3)), 'SpinBox']
			 }
