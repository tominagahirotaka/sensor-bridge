[main]
# 実験タイトル
title       = DPG(X95840W)+LIS3DHx2
[notsave]
# data保存directory(Folder)名
dir_name    = data
# 描画する時間幅
time_width  = 20
# peak間隔の最小幅(sec)（これ以下のピーク間隔は検出しない）
min_peak_dist = 0.400
[board]
# AD Converter resolution (default 10)
ADCres       = 12
# 回路に供給する電圧
volt         = 5
# 時間の単位 3→milli sec, 6→micro sec
time_unit    = 6
# data取得時間間隔(micro sec) (0...serial transfer limit)
time_interval = 2000
# AD変換する回数(1-32)
num_avg     = 1
# 使用ポート番号(0,1,2,3,4,5,)  要素数１の場合は必ず最後に[,]を書くこと
port_num    = 0,1,2
## For Calibration
# i2c pin No       std::vector<int>  要素数１の場合は必ず最後に[,]を書くこと
i2c_pinno      = 20,
# i2c device Addr  std::vector<int>  要素数１の場合は必ず最後に[,]を書くこと
i2c_addr       = 0x50,
# calibration waiting time (msec)    回路が安定するまでの待時間
calib_waiting  = 500
# time interval for detecting rane(max - min) of signal (msec)
calib_int_msec = 2000
#  調整最大振幅(%) & 調整幅(%) for dpm0, dpm1
calib_amplitude_max  = 10,20,30
calib_tuning_width   = 5,5,5
## LIS3DH x2 (SPI0 shared bus)
# SCK/MOSI/MISOはBus共有、CSだけ機体ごとに別Pin
spi_sck_pin  = 18
spi_mosi_pin = 19
spi_miso_pin = 16
# GP17はX95840W制御用に使用中のため、LIS3DHのCSはそれ以外を使う
spi_cs_pin1  = 22
spi_cs_pin2  = 2
# Output Data Rate (CTRL_REG1のODR field; 5=100Hz)
odr1         = 5
odr2         = 5
# Full Scale (0=+-2g, 1=+-4g, 2=+-8g, 3=+-16g)
fs1          = 0
fs2          = 0
[code]
# クラス変数のスコープには注意が必要
# 解決策:lambda式による関数呼び出しなどを使って「ネストされたスコープ」にクラス変数を届けてやれ
#  y = (lambda x:[x for i in range(10)])(x)
#
window_setting = title_style    = "color:orange;"
		 text_box_style = "background:#000000; color:white;"
#		 self.setWindowIcon(QIcon('icon.png'))                        # Icon setting
#
# Menubar setting
#
menubar = menubar = self.menuBar()
          fM = menubar.addMenu('&File')
          sM = menubar.addMenu('&Setting')
          fM.addAction(Qtu.setQAction(self, 'caliBration(not recording)', self.on_calib_button))
          fM.addAction(Qtu.setQAction(self, 'Test(not recording)', self.on_test_button))
          fM.addAction(Qtu.setQAction(self, 'Run(recording)', self.on_start_button))
          fM.addAction(Qtu.setQAction(self, 'MArk(checkpoint / ctrl+a)', self.on_checkpoint_button, self.style().standardIcon(QStyle.SP_DialogApplyButton)))
          fM.addAction(Qtu.setQAction(self, 'Stop', self.on_stop_button))
          fM.addAction(Qtu.setQAction(self, 'Quit', self.on_quit_button, self.style().standardIcon(QStyle.SP_DialogCancelButton)))
          sM.addAction(Qtu.setQAction(self, 'Information', self.on_subject_button))
          sM.addAction(Qtu.setQAction(self, 'Parameter', self.on_param_setting_button))
#
# figs (in window.py) USE self.board.XXX
# 's'(Run) struct = "time(u4:func0), [(port_num)]port(u2:func1), ax1,ay1,az1(u2:func3), ax2,ay2,az2(u2:func4)"
# -> self.board.lab = ['time','port0','port1','port2','ax1','ay1','az1','ax2','ay2','az2']
#    self.board.func_unit = ['sec','V','kOhm','g','g']
#
figs = (lambda self:[[{'data'  : ((0, k+1 , {'peak':False, 'raw':(False, False)}),),
       	       	       'label' : (self.board.lab[0]+'('+self.board.func_unit[0]+')', self.board.lab[k+1]+self.board.lab_sub[k+1]),
          	       'limit' : (None, 'auto'),
		       'grid'  : True,
		       'pargs' : {'ls' : '', 'marker': 'o', 'ms' : 5, 'color':'red'},
		       'fargs' : {'ls' : '-', 'lw' : 3, 'marker': 'o', 'ms' : 0},
		       'legend': False}] for k, p_no in enumerate(self.board.port_num)])(self) +\
		    [[{'data'  : ((0, 4+k , {'peak':False, 'raw':(False, False)}),),
       	       	       'label' : (self.board.lab[0]+'('+self.board.func_unit[0]+')', self.board.lab[4+k]+'('+self.board.func_unit[3]+')'),
          	       'limit' : (None, (-2, 2)),
		       'grid'  : True,
		       'pargs' : {'ls' : '', 'marker': 'o', 'ms' : 1, 'color':'red'},
		       'fargs' : {'ls' : '-', 'lw' : 1, 'marker': 'o', 'ms' : 0},
		       'legend': False}] for k in range(3)] +\
		    [[{'data'  : ((0, 7+k , {'peak':False, 'raw':(False, False)}),),
       	       	       'label' : (self.board.lab[0]+'('+self.board.func_unit[0]+')', self.board.lab[7+k]+'('+self.board.func_unit[4]+')'),
          	       'limit' : (None, (-2, 2)),
		       'grid'  : True,
		       'pargs' : {'ls' : '', 'marker': 'o', 'ms' : 1, 'color':'red'},
		       'fargs' : {'ls' : '-', 'lw' : 1, 'marker': 'o', 'ms' : 0},
		       'legend': False}] for k in range(3)] +\
		    [{'subplots': {'figsize': (15,9), 'sharex':'all', 'tight_layout':True, 'squeeze':False },
		      'adjust'  : {'bottom':None, 'top':None, 'hspace':0.05}}]
#
# panel1(buttons) template (in window.py) USE self.board.XXX
panel1 = {
          'subject'    : [Qtu.setQLabel(""),         'Label'],
          'caliBrate'  : [self.on_calib_button,      'PushButton'],
          'Test'       : [self.on_test_button,       'PushButton'],
          'Run'        : [self.on_start_button,      'PushButton'],
          'mArk' : [self.on_checkpoint_button, 'PushButton'],
          'Stop'       : [self.on_stop_button,       'PushButton'] }
#
# lcd template (in window.py) USE self.board.XXX
lcd = [{'lab_t0': QLabel(u"t0"), 't0': Qtu.setQLCDNumber(self ,'Flat'), 'lab_dt': QLabel(u"   Δt")},
       {'lab_t1': QLabel(u"t1"), 't1': Qtu.setQLCDNumber(self ,'Flat'), 'dt'    : Qtu.setQLCDNumber(self ,'Flat', 7)},
       {'lab_No': None, 'lab_V': QLabel(u"Volt\n(V)"), 'lab_dpm': QLabel(u"dpm\n0-255")}
       ] + (lambda self:[
       {'p'+str(k): QLabel("P.%d" % p_no),
        'V' : Qtu.setQLCDNumber(self ,'Flat'),
        'dpm': Qtu.setQLCDNumber(self ,'Flat')}
	for k, p_no in enumerate(self.board.port_num)])(self) +\
       [{'lab_a1': QLabel(u"Accel #1\n(g)"), 'ax1': Qtu.setQLCDNumber(self ,'Flat'), 'ay1': Qtu.setQLCDNumber(self ,'Flat'), 'az1': Qtu.setQLCDNumber(self ,'Flat')},
        {'lab_a2': QLabel(u"Accel #2\n(g)"), 'ax2': Qtu.setQLCDNumber(self ,'Flat'), 'ay2': Qtu.setQLCDNumber(self ,'Flat'), 'az2': Qtu.setQLCDNumber(self ,'Flat')}]
#
# Window Layout (in window.py)
layout     = [[figs](10),
	      [panel1, lcd,   1](1)]
#
# lcd update (in window.py) USE self.board.XXX
# 'c'(calibrate)時のみdpmがData末尾に付く(dpm_offset=末尾からの逆Index)ため、
# 既存の-（マイナス）Indexパターンを踏襲する。
lcd_update = self.lcd[0]['t0'].display("%.0f" % first_last_data[0][0]),
	     self.lcd[1]['t1'].display("%.0f" % first_last_data[0][1]),
	     self.lcd[1]['dt'].display("%.2f" % (first_last_data[0][1] - first_last_data[0][0])),
	     (lambda first_last_data,self:[
	     [
	     lcd['V'].display("%.2f" % float(first_last_data[k+1][1])),
	     lcd['dpm'].display("%.0f" % self.board.dpm[k] if self.marker != b'c' else
	     					first_last_data[-(3-k)][1])
             ]	for k, lcd in enumerate(self.lcd[3:6])   ])(first_last_data,self),
	     self.lcd[6]['ax1'].display("%.3f" % first_last_data[4][1]),
	     self.lcd[6]['ay1'].display("%.3f" % first_last_data[5][1]),
	     self.lcd[6]['az1'].display("%.3f" % first_last_data[6][1]),
	     self.lcd[7]['ax2'].display("%.3f" % first_last_data[7][1]),
	     self.lcd[7]['ay2'].display("%.3f" % first_last_data[8][1]),
	     self.lcd[7]['az2'].display("%.3f" % first_last_data[9][1])
#
# subject window template (in window.py) USE self.board.XXX
#
subject_template = {'name'   : [u'Name',     QLineEdit(), 'LineEdit'],
                    'height' : [u'Height (cm)', QLineEdit(), 'LineEdit'],
                    'weight' : [u'Weight (kg)', QLineEdit(), 'LineEdit'],
                    'birth'  : [u'Date of birth', QDateEdit(), 'DateEdit'],
                    'gender' : [u'Gender', Qtu.setQComboBox(self, [u'Male', u'Female']), 'ComboBox'],
                    'memo'   : [u'MEMO',     QLineEdit(), 'LineEdit']
		  }
#
# execute below After subject window closed
#
after_subject_window = age = utils.calc_age_now(self.subject['birth'])
		       self.subject['age'] = age
		       txt  = f"{self.subject['name']}"
		       if self.subject['gender'] == u'Male' : txt += f"({age}) "
		       txt += f"{self.subject['gender']}\n"
		       self.panel1['subject'][0].setText(txt)
#
# parameter setting window template (in window.py) USE self.board.XXX
#
param_setting_template = {'time_interval'   : [u'Sampling interval (μs)\n  0..minimum interval', Qtu.setQSpinBox(self, (0, 9999999)), 'SpinBox'],
		       	  'num_avg' : [u'ADC read count/sample', Qtu.setQSpinBox(self, (1, 32)), 'SpinBox'],
			  'volt' : [u'Max voltage (V)', Qtu.setQComboBox(self, ['3.3', '5']), 'ComboBox'],
			   'dpm' :[[u'Digital\nPort0', u'Potentio\nPort1', u'Meter(0-255)\nPort2'],
			  	  [[Qtu.setQSpinBox(self, (0, 255)), Qtu.setQSpinBox(self, (0, 255)), Qtu.setQSpinBox(self, (0, 255))]], 'MultiSpinBox'],
			'calib_waiting': [u'calib_wait time after value change (msec)', Qtu.setQSpinBox(self, (0, 1000)), 'SpinBox'],
			'calib_int_msec': [u'calib_amplitude detection time (msec)', Qtu.setQSpinBox(self, (100, 10000)), 'SpinBox'],
			'calib_amplitude_max': [[u'caliblation\nPort0', u'Max amplitude\nPort1', u'(%)\nPort2'],
			[[Qtu.setQSpinBox(self, (0, 100)), Qtu.setQSpinBox(self, (0, 100)), Qtu.setQSpinBox(self, (0, 100))]] , 'MultiSpinBox'],
			'calib_tuning_width': [[u'caliblation\nPort0', u'Tuning width\nPort1', u'(%)\nPort2'],
			[[Qtu.setQSpinBox(self, (0, 100)), Qtu.setQSpinBox(self, (0, 100)), Qtu.setQSpinBox(self, (0, 100))]] , 'MultiSpinBox'],
			'title': [u'title', QLineEdit(),'LineEdit'],
			'dir_name': [u'Save folder name', QLineEdit(), 'LineEdit'],
			'min_peak_dist': [u'min_peak_dist', QLineEdit(), 'LineEdit'],
                        'ADCres' : [u'ADC resolution', Qtu.setQSpinBox(self, (8, 12)), 'SpinBox'],
			'i2c_pinno': [u'I2C pin No.', QLineEdit(), 'LineEdit'],
			'i2c_addr':  [u'I2C Address', QLineEdit(), 'LineEdit'],
			'spi_cs_pin1': [u'LIS3DH #1 CS Pin', Qtu.setQSpinBox(self, (0, 28)), 'SpinBox'],
			'spi_cs_pin2': [u'LIS3DH #2 CS Pin', Qtu.setQSpinBox(self, (0, 28)), 'SpinBox'],
			'odr1': [u'Accel #1 ODR', Qtu.setQSpinBox(self, (1, 9)), 'SpinBox'],
			'odr2': [u'Accel #2 ODR', Qtu.setQSpinBox(self, (1, 9)), 'SpinBox'],
			'fs1': [u'Accel #1 Full Scale', Qtu.setQSpinBox(self, (0, 3)), 'SpinBox'],
			'fs2': [u'Accel #2 Full Scale', Qtu.setQSpinBox(self, (0, 3)), 'SpinBox'],
			 }
