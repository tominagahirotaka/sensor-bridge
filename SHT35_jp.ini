[main]
# 実験タイトル
title       = 温湿度測定(SHT35)
[notsave]
# data保存directory(Folder)名
dir_name    = data_SHT35
# 描画する時間幅
time_width  = 20
# 描画する点の数(20-1000) (Slow animation ONLY)
num_points  = 50
# peak間隔の最小幅(sec)（これ以下のピーク間隔は検出しない）
min_peak_dist = 0.400
[board]
# 時間の単位 3→milli sec, 6→micro sec
time_unit   = 6
# i2c pin No       std::vector<int>  要素数１の場合は必ず最後に[,]を書くこと
i2c_pinno    = 20,18
# i2c device Addr  std::vector<int>  要素数１の場合は必ず最後に[,]を書くこと
i2c_addr     = 0x44,0x45
# Command      0.5High,1High,  2High,  4High,  10High
mode_list    = 0x2032, 0x2130, 0x2236, 0x2334, 0x2737
sleep_time   = 2000,   1000,   500,    250,    100
modeno       = 4
[code]
# クラス変数のスコープには注意が必要
# 解決策:lambda式による関数呼び出しなどを使って「ネストされたスコープ」にクラス変数を届けてやれ
#  y = (lambda x:[x for i in range(10)])(x)
#
window_setting = title_style    = "color:magenta;"
		 text_box_style = "background:black; color:white;"
#		 self.setWindowIcon(QIcon('icon.png'))                        # Icon setting
#
# Menubar setting
#
menubar = menubar = self.menuBar()
          fM = menubar.addMenu('&File')
          sM = menubar.addMenu('&Setting')
          fM.addAction(Qtu.setQAction(self, 'テスト（記録なし）', self.on_test_button))
          fM.addAction(Qtu.setQAction(self, '実行（記録中）', self.on_start_button))
          fM.addAction(Qtu.setQAction(self, 'マーク（チェックポイント）', self.on_checkpoint_button, self.style().standardIcon(QStyle.SP_DialogApplyButton)))
          fM.addAction(Qtu.setQAction(self, '停止', self.on_stop_button))
          fM.addAction(Qtu.setQAction(self, '終了', self.quit, self.style().standardIcon(QStyle.SP_DialogCancelButton)))
          sM.addAction(Qtu.setQAction(self, '測定情報', self.on_subject_button))
          sM.addAction(Qtu.setQAction(self, 'パラメータ設定', self.on_param_setting_button))
#
# figs (in window.py) USE self.board.XXX
#
# {'label'  : (None|auto|'hoge', None|auto|'hoge'), 'label2' : (None|auto|'hoge', None|auto|'hoge'),
#  'limit'  : (None|auto|num ,   None|auto|num ),   'limit2' : (None|auto|num ,   None|auto|num ),
#  'data'   : ((num0, num1, {'peak':True|False, 'raw':(False, True), 'label':'1'} ),
#              (num0, num2, {'peak':True|False, 'raw':(False, True), 'label':'2'} ), ...),
#  'grid'   : True,
#  'legend' : False}
#       |
#       V
#  [ [ dict, dict,...], [ dict, dict,...], ...
#    , {'figsize': (15,6), 'sharex':'"none"'|'"all"'|'"row"'|'"col"', 'sharey':'"all"',...} ]
#    Figure dimension =  columns * rows
#
#          	       'limit': (None, (0, 4096)),
#          	       'limit' : (None, self.board.lim_auto_raw[1]),
#
figs = (lambda self:[[{'label' : (None, self.board.lab[1]+'('+self.board.func_unit[1]+')'),
          	       'limit' : (None, (10,50)),
       	       	       'data'  : [(0, 2*k+1 , {'peak':False, 'raw':(False, False), 'leg_lab':self.board.lab_sub[2*k+1]}) for k, no in enumerate(self.board.sensor_id) ],
		       'grid'  : True,
		       'pargs' : {'ls' : '', 'marker': 'o', 'ms' : 10, 'color':'red'},
		       'fargs' : {'ls' : '', 'lw' : 2, 'marker': 'o', 'ms' : 8},
		       'legend': True}]] +
		    [[{'label' : (self.board.lab[0]+'('+self.board.func_unit[0]+')',  self.board.lab[-1]+'('+self.board.func_unit[-1]+')'),
          	       'limit' : (None, (20,100)),
		       'data'  : [(0, 2*k+2 , {'peak':False, 'raw':(False, False), 'leg_lab':self.board.lab_sub[2*k+1]}) for k, no in enumerate(self.board.sensor_id) ],
		       'grid'  : True,
		       'pargs' : {'ls' : '', 'marker': 'o', 'ms' : 10, 'color':'red'},
		       'fargs' : {'ls' : '', 'lw' : 2, 'marker': 'o', 'ms' : 8},
		       'legend': True}
		    ]
		    , {'subplots': {'figsize': (15,6), 'sharex':'all', 'tight_layout':True, 'squeeze':False },
		       'adjust'  : {'bottom':None, 'top':None, 'hspace':0.05}}
		    ]
       )(self)
#
# panel1(buttons) template (in window.py) USE self.board.XXX
panel1 = {
          'subject'    : [Qtu.setQLabel(""),         'Label'],
          'テスト'       : [self.on_test_button,       'PushButton'], 
          '実行'        : [self.on_start_button,      'PushButton'],
          'マーク' : [self.on_checkpoint_button, 'PushButton'],
          '停止'       : [self.on_stop_button,       'PushButton'] }
#
# lcd template
lcd = [{'lab_t0': QLabel(u"t0"), 't0': Qtu.setQLCDNumber(self ,'Flat'), 'lab_dt': QLabel(u"   Δt")},
       {'lab_t1': QLabel(u"t1"), 't1': Qtu.setQLCDNumber(self ,'Flat'), 'dt': Qtu.setQLCDNumber(self ,'Flat', 7)},
       {'lab_No': None, 'lab_V': QLabel(u"temp(℃)"), 'lab_HBR': QLabel(u"humid(%)")}
       ] + (lambda self:[
       {'id'+str(k): QLabel("%s" % p_no.replace('_','\n').replace('wire','w').replace('0x','')), 'temp' : Qtu.setQLCDNumber(self ,'Flat'),
       'humid': Qtu.setQLCDNumber(self ,'Flat')} for k, p_no in enumerate(self.board.sensor_id)])(self)
#    , columnstretch=[1,3,3] 
# クラス変数のスコープには注意が必要
# 解決策:lambda式による関数呼び出しなどを使って「ネストされたスコープ」にクラス変数を届けてやれ
#  y = (lambda x:[x for i in range(10)])(x)
#
# lcd update
lcd_update = self.lcd[0]['t0'].display("%.0f" % first_last_data[0][0]),
	     self.lcd[1]['t1'].display("%.0f" % first_last_data[0][1]),
	     self.lcd[1]['dt'].display("%.1f" % (first_last_data[0][1] - first_last_data[0][0])),
	     (lambda first_last_data,self:[
	     [
	     lcd['temp'].display("%.1f" % first_last_data[2*k+1][1]),
	     lcd['humid'].display("%.1f" % first_last_data[2*k+2][1])
             ]	for k, lcd in enumerate(self.lcd[3:])   ])(first_last_data,self)

# subject window template
subject_template = {'room'   : [u'測定室',   QLineEdit(), 'LineEdit'],
		    'device' : [u'測定装置', QLineEdit(), 'LineEdit'],
                    'name'   : [u'測定者',   QLineEdit(), 'LineEdit'],
		    'memo'   : [u'MEMO',     QLineEdit(), 'LineEdit'] }
#
#
# execute below Before subject window opened
#before_subject_window = 
# execute below After subject window closed
after_subject_window = txt = f"測定室:{self.subject['room']}\n装置:{self.subject['device']}\n測定者:{self.subject['name']}\nMEMO:{self.subject['memo']}"
		       self.panel1['subject'][0].setText(txt)
#
# parameter setting window template (in window.py) USE self.board.XXX
#
param_setting_template = {'modeno'   : [u'Sampling Rate\n[0]..0.5(回/sec),\n[1]..1, [2]..2,\n[3]..4, [4]..10', Qtu.setQSpinBox(self, (0, 4)), 'SpinBox'] }

